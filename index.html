<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14110F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Men Wanted — a confidential invitation to stand beside the groom. Operation Altar, September 26, 2026."
    />
    <title>Men Wanted — The Brotherhood Gazette</title>

    <!-- Shared links unfurl into the front page of the Gazette.
         VITE_SITE_URL is set in .env; og:image must be an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Brotherhood Gazette" />
    <meta property="og:title" content="Men Wanted" />
    <meta
      property="og:description"
      content="Looking for the men who will stand beside a groom on one of the most important days of his life. Applications now open."
    />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Front page of The Brotherhood Gazette: MEN WANTED" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Men Wanted" />
    <meta
      name="twitter:description"
      content="Looking for the men who will stand beside a groom on one of the most important days of his life."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.jpg" />
    <!-- Fonts are self-hosted (see scripts/fetch-fonts.py) — no third-party request -->
    <link
      rel="preload"
      href="/fonts/RobotoSlab-900.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/Inter-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
